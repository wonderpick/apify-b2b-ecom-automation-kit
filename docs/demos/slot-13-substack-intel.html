</head>
<body>

tch":"Sponsorship inquiry for SemiAnalysis\n\nHi Dylan Patel, Following SemiAnalysis (336,000+ subscribers). We'd love to check your upcoming Q1/Q2 newsletter sponsorship availability and rate card."}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('dashboard-data').textContent || '{}');
  document.getElementById('meta-line').textContent = 'Mode: ' + (data.mode || '') + ' · Generated: ' + (data.generatedAt || '') + ' · Rows: ' + (data.rows || []).length;
  const kg = document.getElementById('kpi-grid');
  for (const k of (data.kpis || [])) {
    const d = document.createElement('div'); d.className = 'kpi';
    const b = document.createElement('b'); b.textContent = String(k.value ?? '-');
    const s = document.createElement('span'); s.textContent = String(k.label ?? '');
    d.appendChild(b); d.appendChild(s); kg.appendChild(d);
  }
  const tbody = document.getElementById('tbody');
  const qEl = document.getElementById('q');
  const tierEl = document.getElementById('tier');

  function safeHref(u) {
    return typeof u === 'string' && /^https?:\/\//i.test(u) ? u : null;
  }

  function render() {
    while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
    const q = (qEl.value || '').trim().toLowerCase();
    const f = tierEl.value;
    const rows = (data.rows || []).filter((r) => {
      if (f === 'SPONSOR' && !r.hasSponsorSignal) return false;
      if (f === 'EMAIL' && !r.primaryEmail) return false;
      if (f === 'TIER_1_HOT' && r.tier !== 'TIER_1_HOT') return false;
      if (!q) return true;
      return JSON.stringify(r).toLowerCase().includes(q);
    });
    for (const r of rows) {
      const tr = document.createElement('tr');
      const td1 = document.createElement('td');
      const titleEl = document.createElement('strong'); titleEl.textContent = r.title || '-';
      const subEl = document.createElement('div'); subEl.className = 'muted'; subEl.textContent = r.subtitle || '';
      td1.appendChild(titleEl); td1.appendChild(subEl);

      const td2 = document.createElement('td');
      td2.textContent = r.revenueSummary || '-';

      const td3 = document.createElement('td');
      td3.textContent = r.sponsorSummary || '-';

      const td4 = document.createElement('td');
      td4.textContent = r.contactSummary || '-';

      const td5 = document.createElement('td');
      const pill = document.createElement('span');
      pill.className = 'pill ' + (r.tier === 'TIER_1_HOT' ? 'hot' : (r.hasSponsorSignal ? 'ok' : ''));
      pill.textContent = String(r.score ?? '-') + ' · ' + String(r.tier || 'INFO');
      td5.appendChild(pill);
      const actDiv = document.createElement('div'); actDiv.style.marginTop = '6px';
      const href = safeHref(r.url);
      if (href) {
        const a = document.createElement('a'); a.className = 'btn'; a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.textContent = 'Open'; actDiv.appendChild(a);
      }
      if (r.pitch) {
        const b = document.createElement('button'); b.className = 'btn'; b.type = 'button'; b.textContent = 'Copy Pitch';
        b.addEventListener('click', () => { navigator.clipboard?.writeText(r.pitch); b.textContent = 'Copied!'; setTimeout(() => { b.textContent = 'Copy Pitch'; }, 1200); });
        actDiv.appendChild(b);
      }
      td5.appendChild(actDiv);
      tr.append(td1, td2, td3, td4, td5);
      tbody.appendChild(tr);
    }
  }
  qEl.addEventListener('input', render);
  tierEl.addEventListener('change', render);
  render();
})();
</script>

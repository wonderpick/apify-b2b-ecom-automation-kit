<script>
(function(){
  const raw = document.getElementById('dashboard-data');
  const data = raw ? JSON.parse(raw.textContent || '{}') : { summary: {}, apps: [] };
  const s = data.summary || {};
  const apps = Array.isArray(data.apps) ? data.apps : [];
  const el = (tag, cls, txt) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined && txt !== null) n.textContent = String(txt);
    return n;
  };
  const svgEl = (tag, attrs) => {
    const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, String(v));
    return n;
  };
  const copyTxt = (btn, text) => {
    if (!text) return;
    const orig = btn.textContent;
    const flash = (msg) => { btn.textContent = msg; setTimeout(() => { btn.textContent = orig; }, 1400); };
    const fallbackCopy = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand && document.execCommand('copy');
        document.body.removeChild(ta);
        flash(ok ? 'Copied!' : 'Copy failed');
      } catch (_e) {
        flash('Copy failed');
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => flash('Copied!')).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  };

  const kpiWrap = document.getElementById('kpis');
  const hotCount = apps.filter((a) => a.tier === 'HOT').length;
  const kpis = [
    ['Apps Analyzed', s.appsAnalyzed ?? apps.length],
    ['HOT Churn Leads', hotCount],
    ['Verified Emails', s.verifiedEmailsCount ?? 0],
    ['Paid Ads Verified', s.paidAdsVerifiedCount ?? 0],
    ['Watch-Diff Skipped ($0)', s.watchDiffSkipped ?? 0],
    ['Peak RAM / Duration', (s.peakMemoryMb ?? '-') + 'MB / ' + (s.durationSec ?? '-') + 's'],
  ];
  for (const [label, val] of kpis) {
    const box = el('div', 'kpi');
    box.appendChild(el('div', 'lbl', label));
    box.appendChild(el('div', 'val', val));
    kpiWrap.appendChild(box);
  }
  document.getElementById('metaSub').textContent =
    'Mode: ' + (s.mode || 'app_intelligence') + ' | Countries: ' + ((s.countries || []).join(', ') || 'us') + ' | Records: ' + (s.recordsEmitted ?? apps.length);

  function buildPainSvg(pains) {
    const entries = Object.entries(pains || {}).filter(([, c]) => c > 0).sort((a, b) => b[1] - a[1]).slice(0, 4);
    if (!entries.length) return null;
    const maxV = Math.max(...entries.map(([, c]) => c), 1);
    const svg = svgEl('svg', { width: 250, height: entries.length * 20 + 4, viewBox: '0 0 250 ' + (entries.length * 20 + 4) });
    entries.forEach(([k, v], i) => {
      const y = i * 20 + 2;
      const w = Math.max(8, Math.round((v / maxV) * 110));
      const lbl = svgEl('text', { x: 0, y: y + 12, fill: '#93a4c3', 'font-size': 10 });
      lbl.textContent = k.slice(0, 18);
      svg.appendChild(lbl);
      svg.appendChild(svgEl('rect', { x: 118, y: y + 3, width: w, height: 11, rx: 3, fill: '#f43f5e' }));
      const cnt = svgEl('text', { x: 124 + w, y: y + 12, fill: '#e6edf7', 'font-size': 10 });
      cnt.textContent = String(v);
      svg.appendChild(cnt);
    });
    return svg;
  }

  function buildSparklineSvg(series) {
    if (!Array.isArray(series) || series.length < 2) return null;
    const w = 120, h = 28, min = Math.min(...series, 1), max = Math.max(...series, 5);
    const pts = series.map((v, i) => {
      const x = Math.round((i / (series.length - 1)) * (w - 8) + 4);
      const y = Math.round(h - 4 - ((v - min) / Math.max(0.1, max - min)) * (h - 8));
      return x + ',' + y;
    }).join(' ');
    const svg = svgEl('svg', { width: w, height: h, viewBox: '0 0 ' + w + ' ' + h });
    svg.appendChild(svgEl('polyline', { fill: 'none', stroke: '#38bdf8', 'stroke-width': 2, points: pts }));
    return svg;
  }

  const list = document.getElementById('list');
  const qEl = document.getElementById('q');
  const covEl = document.getElementById('fCov');
  const tierEl = document.getElementById('fTier');
  const paidEl = document.getElementById('fPaid');
  const trendEl = document.getElementById('fTrend');

  function render() {
    while (list.firstChild) list.removeChild(list.firstChild);
    const q = (qEl.value || '').trim().toLowerCase();
    const fc = covEl.value, ft = tierEl.value, fp = paidEl.value, ftr = trendEl.value;
    const filtered = apps.filter((a) => {
      if (fc !== 'ALL' && a.cov !== fc) return false;
      if (ft !== 'ALL' && a.tier !== ft) return false;
      if (fp === 'YES' && !a.paid) return false;
      if (fp === 'NO' && a.paid) return false;
      if (ftr !== 'ALL' && a.trend !== ftr) return false;
      if (q && !(a.name + ' ' + a.dev + ' ' + (a.email || '') + ' ' + a.topPain + ' ' + (a.sdks || []).join(' ')).toLowerCase().includes(q)) return false;
      return true;
    });
    if (!filtered.length) { list.appendChild(el('div', 'card muted', 'No apps match the selected filters.')); return; }

    for (const a of filtered) {
      const card = el('div', 'card');
      const top = el('div', 'rowTop');
      const tb = el('div', 'titleBox');
      tb.appendChild(el('span', 'appName', a.name));
      tb.appendChild(el('span', 'badge b-' + a.tier, a.tier + ' ' + a.score));
      tb.appendChild(el('span', 'badge', a.cov + (a.match ? ' · ' + a.match : '')));
      if (a.paid) tb.appendChild(el('span', 'badge', 'PAID ADS: ' + (a.ads.join(', ') || 'YES')));
      if (a.asoScore !== null) tb.appendChild(el('span', 'badge', 'ASO ' + a.asoScore + ' (' + (a.asoGrade || '-') + ')'));
      top.appendChild(tb);
      top.appendChild(el('span', 'muted', a.dev + (a.legal && a.legal !== a.dev ? ' (' + a.legal + ')' : '')));
      card.appendChild(top);

      const m = el('div', 'metrics');
      const addM = (lbl, val) => { const sp = el('span'); sp.textContent = lbl + ': '; sp.appendChild(el('b', '', val)); m.appendChild(sp); };
      addM('Lifetime', a.life !== null ? a.life + '★' : '-');
      addM('Recent', a.rec !== null ? a.rec + '★' : '-');
      addM('Churn Gap', a.gap !== null ? a.gap + '★' : '-');
      addM('Sentiment', (a.sent !== null ? a.sent : '-') + ' (' + a.trend + ')');
      addM('Top Pain', a.topPain);
      addM('Email', a.email ? (a.email + ' [' + a.role + ']') : 'None');
      if (a.phone) addM('Phone', a.phone);
      card.appendChild(m);

      const svgRow = el('div', 'svgRow');
      const pSvg = buildPainSvg(a.pains);
      if (pSvg) svgRow.appendChild(pSvg);
      const hSvg = buildSparklineSvg(a.hist);
      if (hSvg) svgRow.appendChild(hSvg);
      if (svgRow.childNodes.length) card.appendChild(svgRow);

      const btns = el('div', 'btns');
      const det = el('div', 'details');
      const toggleBtn = el('button', '', 'Inspect SDK / Privacy / ASO / Quotes');
      toggleBtn.addEventListener('click', () => det.classList.toggle('open'));
      btns.appendChild(toggleBtn);
      if (a.body) {
        const cpOut = el('button', '', 'Copy Cold Outreach');
        cpOut.addEventListener('click', () => copyTxt(cpOut, 'Subject: ' + a.subj + '\n\n' + a.body));
        btns.appendChild(cpOut);
      }
      const addLink = (href, label) => {
        if (!href || !/^https?:\/\//i.test(href)) return;
        const lk = el('a', 'btn', label); lk.href = href; lk.target = '_blank'; lk.rel = 'noopener noreferrer';
        btns.appendChild(lk);
      };
      addLink(a.iosUrl, 'iOS Store');
      addLink(a.gpUrl, 'Google Play');
      addLink(a.dmUrl, 'LinkedIn Decision Makers');
      card.appendChild(btns);

      const p1 = el('div', 'pane');
      p1.appendChild(el('h4', '', 'SDK, Privacy & Web Source'));
      p1.appendChild(el('div', '', 'SDKs: ' + ((a.sdks || []).join(', ') || 'None detected')));
      p1.appendChild(el('div', 'muted', 'Privacy Risk: ' + a.privRisk + ' | Source: ' + (a.webSrc || '-')));
      det.appendChild(p1);

      const p2 = el('div', 'pane');
      p2.appendChild(el('h4', '', 'ASO, Peer Delta & Emerging Topics'));
      p2.appendChild(el('div', '', 'Missing Hints: ' + ((a.missingKw || []).join(', ') || 'None')));
      if ((a.topics || []).length) p2.appendChild(el('div', '', 'Emerging Topics: ' + a.topics.join(', ')));
      if (a.peer) p2.appendChild(el('div', 'muted', 'Peer Risk Rank #' + a.peer.r + '/' + a.peer.n + ' | Rating vs Peers: ' + (a.peer.rv ?? '-') + ' | ASO vs Peers: ' + (a.peer.av ?? '-')));
      for (const ri of (a.relImpacts || [])) {
        const rawV = String(ri.v || '').trim();
        const vLbl = (!rawV || !/\d/.test(rawV) || /^latest(?:[\s_]release)?$/i.test(rawV)) ? 'latest release' : (/^v\d/i.test(rawV) ? rawV : ('v' + rawV));
        p2.appendChild(el('div', 'muted', ri.s.toUpperCase() + ' ' + vLbl + ': ' + ri.lvl + ' (' + ri.d + '★)'));
      }
      det.appendChild(p2);

      const p3 = el('div', 'pane');
      p3.appendChild(el('h4', '', 'Top Critical Quotes & $0 CS Reply'));
      if (!(a.quotes || []).length) p3.appendChild(el('div', 'muted', 'No critical quotes sampled.'));
      for (const qt of (a.quotes || [])) {
        const qb = el('div', 'quote');
        qb.appendChild(el('div', '', '[' + qt.s.toUpperCase() + ' ' + qt.r + '★] ' + qt.t));
        if (qt.cs) {
          const cpCs = el('button', '', 'Copy CS Reply Draft');
          cpCs.style.marginTop = '6px';
          cpCs.addEventListener('click', () => copyTxt(cpCs, qt.cs));
          qb.appendChild(cpCs);
        }
        p3.appendChild(qb);
      }
      det.appendChild(p3);

      card.appendChild(det);
      list.appendChild(card);
    }
  }

  qEl.addEventListener('input', render);
  for (const ctrl of [covEl, tierEl, paidEl, trendEl]) {
    ctrl.addEventListener('change', render);
    ctrl.addEventListener('input', render);
  }
  render();
})();
</script>
</body>
</html>

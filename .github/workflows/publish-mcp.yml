name: Publish to Official MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mcp-publisher CLI
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar -xz mcp-publisher
          chmod +x ./mcp-publisher
          ./mcp-publisher --version || true

      - name: Login to Official MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to Official MCP Registry
        run: ./mcp-publisher publish
